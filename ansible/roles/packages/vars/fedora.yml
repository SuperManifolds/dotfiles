---
dnf_packages:
  - ansible
  - awscli2
  - fastfetch
  - ffmpeg-free
  - fish
  - gh
  - gnupg2
  - jq
  - nmap-ncat
  - nodejs
  - npm
  - p7zip
  - ripgrep
  - stow
  - tmux
  - yt-dlp
  - mariadb-server
  - golang
  # New packages
  - pipx
  - helm
  - git-filter-repo
  # .gitconfig marks the lfs filter required = true, so a missing git-lfs is a
  # hard failure rather than a silent checkout of pointer files.
  - git-lfs
  # Provides the Secret Service (org.freedesktop.secrets) that credential-storing
  # tools talk to. On a headless box it also needs the unlock unit; see
  # tasks/headless-keyring.yml.
  - gnome-keyring
  # Secret scanning in the global pre-commit hook. The hook hard-fails without
  # it rather than skipping, so it has to be installed, not optional.
  - gitleaks
  # Browser for agent-browser (reddit-thread skill). Required on aarch64, where
  # Chrome for Testing has no build for `agent-browser install` to download.
  - chromium
  - git-delta
  - difftastic
  - eza
  - k9s
  - tree-sitter-cli
  # Shell ergonomics: fzf.fish pickers are backed by fd + bat, zoxide adds `z`.
  - fzf
  - fd-find
  - bat
  - zoxide
  - btop
  - unar

# Paired with the zls version Mason installs (see fedora.yml).
zig_version: "0.16.0"
zig_target: "{{ ansible_architecture }}-linux"
zig_prefix: "{{ ansible_env.HOME }}/.local/share/zig/zig-{{ zig_target }}-{{ zig_version }}"

dnf_desktop_packages:
  - imhex
  - geary
  - celluloid
  - weechat

flatpak_apps:
  - io.github.zen_browser.zen
  - it.mijorus.smile
  - rest.insomnia.Insomnia
  - com.usebottles.bottles
  - tv.plex.PlexDesktop
  - com.valvesoftware.Steam

# Pinned for the same reason as go_packages above.
npm_packages:
  - name: yarn
    version: "1.22.22"
  - name: "@withgraphite/graphite-cli"
    version: "1.8.6"

# Pinned, not @latest: two machines provisioned a week apart otherwise get
# different binaries, and a breaking release lands with nothing to point at.
# Bump deliberately, the same way zig_version is bumped.
go_packages:
  - github.com/segmentio/golines@v0.13.0
  - github.com/joshmedeski/sesh/v2@v2.31.0
