---
- name: Include macOS tasks
  ansible.builtin.include_tasks: macos.yml
  when: ansible_os_family == "Darwin"

- name: Include Fedora tasks
  ansible.builtin.include_tasks: fedora.yml
  when: ansible_distribution == "Fedora"

- name: Include Fedora desktop tasks
  ansible.builtin.include_tasks: fedora-desktop.yml
  when:
    - ansible_distribution == "Fedora"
    - install_desktop | default(true)

- name: Include Arch tasks
  ansible.builtin.include_tasks: arch.yml
  when: ansible_os_family == "Archlinux"

- name: Include Arch desktop tasks
  ansible.builtin.include_tasks: arch-desktop.yml
  when:
    - ansible_os_family == "Archlinux"
    - install_desktop | default(true)

# Headless Linux only. A desktop session already runs an unlocked keyring via
# PAM, and replacing that daemon with an empty-passphrase unlock would break it.
- name: Include headless keyring tasks
  ansible.builtin.include_tasks: headless-keyring.yml
  when:
    - ansible_system == "Linux"
    - not (install_desktop | default(true))

# Cross-platform, and last: these npm CLIs need node from the OS lists above.
- name: Include agent CLI tasks
  ansible.builtin.include_tasks: agent-clis.yml
