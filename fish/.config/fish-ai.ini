# fish-ai — https://github.com/Realiserad/fish-ai
#
# The active provider is selected by `configuration` below. The Anthropic API
# key is intentionally NOT stored here: fish-ai loads it from the system
# keyring (service "fish-ai", user "anthropic"). Set it once with:
#     fish_ai_put_api_key
#
# Keybindings: Ctrl+G ("Generate") toggles comment <-> command; Ctrl+Space
# autocompletes the current command (or fixes it after a failure).

[fish-ai]
configuration = anthropic
keymap_1 = ctrl-g

[anthropic]
provider = anthropic
# Pinned to a model where thinking is OFF unless explicitly requested. fish-ai
# 2.13.1 reads response.content[0].text unconditionally (engine.py:401) and
# passes no thinking config for the Anthropic provider, so on Claude Sonnet 5 —
# where adaptive thinking is on by default — content[0] is a ThinkingBlock and
# `explain` dies with "'ThinkingBlock' object has no attribute 'text'".
# Revisit once fish-ai narrows on block .type.
model = claude-sonnet-4-6
