# fish-ai — https://github.com/Realiserad/fish-ai
#
# The active provider is selected by `configuration` below. The Anthropic API
# key is intentionally NOT stored here: fish-ai loads it from the system
# keyring (service "fish-ai", user "anthropic"). Set it once with:
#     fish_ai_put_api_key
#
# Keybindings: Ctrl+G ("Generate") toggles comment <-> command; Ctrl+Space
# autocompletes the current command (or fixes it after a failure).

[fish-ai]
configuration = anthropic
keymap_1 = ctrl-g

[anthropic]
provider = anthropic
model = claude-sonnet-4-6
