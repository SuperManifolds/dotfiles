set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-shell "$SHELL"

# Let programs forward raw escapes to the outer terminal (e.g. the ssh
# wrapper's OSC 11 background-color indicator reaching Ghostty).
set -g allow-passthrough on

set -g mouse on
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},claude},claude:#{b:pane_current_path},#{pane_title}}'
set -g base-index 1
set -g pane-base-index 1
set-option -g set-clipboard on

unbind-key C-b
set -g prefix 'C-Space'
bind 'C-Space' send-prefix

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# sesh: fuzzy jump to / create a session per project or worktree (prefix + T).
bind T display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list --icons | fzf --ansi --no-sort --prompt "⚡  ")"'

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-yank'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

run '~/.config/tmux/plugins/tpm/tpm'
